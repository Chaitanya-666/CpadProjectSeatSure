name: CI

on:
  push:
  pull_request:

jobs:
  api:
    name: API tests (Node + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: seatsure
          POSTGRES_PASSWORD: seatsure_local
          POSTGRES_DB: seatsure_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U seatsure" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm test
