# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repo.
# DATABASE_URL is the Neon connection string, pasted in when Render asks.
services:
  - type: web
    name: seatsure
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: CHECKIN_GRACE_MINUTES
        value: "15"
